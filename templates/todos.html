<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do List</title>
   
</head>
<body>
    <h1>To Do List</h1>
<form>action="{{ url_for('add_todo')}}"
method="POST">
    <input type="text" name="todo"
    placeholder="Enter a task"
    required>
    <button type="submit">Add Task</button>
</form>
    <ul>
        {%for todo in todos%}
           <li>{{todo}}</li>
        {%endfor%}
    </ul>
</body>
</html>
